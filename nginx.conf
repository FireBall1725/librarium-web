server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API and health requests to the backend service
    location /api {
        proxy_pass http://librarium-api:8080/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://librarium-api:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Hashed file names, so a name never means two different files. Caching them
    # forever is what makes the no-store index below cheap: a reload re-fetches
    # one small document and keeps every asset it already has.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cached. This is the file that names the current hashes, so a cached
    # copy pins a tab to the build it was deployed with: the deploy lands, the
    # address is unchanged, and the browser keeps serving yesterday's bundle
    # until someone hard-refreshes. It also covers version.json, which the app
    # reads to notice exactly that.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # Locale bundles and the icons are not hashed, so a new string or a changed
    # logo would go unseen for as long as the browser felt like. Short enough to
    # pick up a deploy, long enough not to refetch on every navigation.
    location /locales/ {
        add_header Cache-Control "public, max-age=300";
    }

    # Serve the SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
