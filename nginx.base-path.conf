# Serving the app from a path rather than the root of a host.
#
# Used instead of nginx.conf when LIBRARIUM_BASE_PATH is set; the entrypoint
# substitutes __LIBRARIUM_BASE__ and swaps this in. Kept as its own file rather
# than as conditional templating over one config, because the differences are
# structural: an empty prefix turns `location = __LIBRARIUM_BASE__` into
# `location =`, which nginx will not parse.
server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Relative Location headers. Left on, nginx builds redirects from the host
    # and the port it is listening on, so a reverse proxy in front of this
    # sends the browser to port 3000 on the public hostname.
    absolute_redirect off;

    # A mounted app is usually linked without its trailing slash, and the
    # redirect is what makes /librarium and /librarium/ the same page.
    location = __LIBRARIUM_BASE__ {
        return 301 __LIBRARIUM_BASE__/;
    }

    # Somebody who reaches the host without the prefix. Serving index.html here
    # would half-work: the page loads, every asset it points at is under the
    # prefix, and the router disagrees with the address bar.
    location = / {
        return 301 __LIBRARIUM_BASE__/;
    }

    # The api serves /api/v1/... whatever this app is mounted at, and should
    # not have to know. The path on proxy_pass replaces the matched prefix.
    location __LIBRARIUM_BASE__/api {
        proxy_pass http://librarium-api:8080/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location __LIBRARIUM_BASE__/health {
        proxy_pass http://librarium-api:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Strip the prefix and serve from the document root, so the files on disk
    # do not have to be moved into a directory named after the mount point.
    # `rewrite ... break` rather than `alias`, because try_files against an
    # alias resolves inconsistently across nginx versions.
    location __LIBRARIUM_BASE__/ {
        rewrite ^__LIBRARIUM_BASE__/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
