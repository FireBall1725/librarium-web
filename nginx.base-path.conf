# Serving the app from a path rather than the root of a host.
#
# Used instead of nginx.conf when LIBRARIUM_BASE_PATH is set; the entrypoint
# substitutes __LIBRARIUM_BASE__ and swaps this in. Kept as its own file rather
# than as conditional templating over one config, because the differences are
# structural: an empty prefix turns `location = __LIBRARIUM_BASE__` into
# `location =`, which nginx will not parse.
server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Relative Location headers. Left on, nginx builds redirects from the host
    # and the port it is listening on, so a reverse proxy in front of this
    # sends the browser to port 3000 on the public hostname.
    absolute_redirect off;

    # A mounted app is usually linked without its trailing slash, and the
    # redirect is what makes /librarium and /librarium/ the same page.
    location = __LIBRARIUM_BASE__ {
        return 301 __LIBRARIUM_BASE__/;
    }

    # Somebody who reaches the host without the prefix. Serving index.html here
    # would half-work: the page loads, every asset it points at is under the
    # prefix, and the router disagrees with the address bar.
    location = / {
        return 301 __LIBRARIUM_BASE__/;
    }

    # The api serves /api/v1/... whatever this app is mounted at, and should
    # not have to know. The path on proxy_pass replaces the matched prefix.
    location __LIBRARIUM_BASE__/api {
        # nginx stops at 1 MB by default, which refused most PNG covers with a
        # 413. The API sets its own limits; this matches its largest (edition files).
        client_max_body_size 2g;
        proxy_pass http://librarium-api:8080/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location __LIBRARIUM_BASE__/health {
        proxy_pass http://librarium-api:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Hashed file names, so a name never means two different files. Caching them
    # forever is what makes the no-store index below cheap: a reload re-fetches
    # one small document and keeps every asset it already has.
    location __LIBRARIUM_BASE__/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        rewrite ^__LIBRARIUM_BASE__/(.*)$ /$1 break;
    }

    # Never cached. This is the file that names the current hashes, so a cached
    # copy pins a tab to the build it was deployed with: the deploy lands, the
    # address is unchanged, and the browser keeps serving yesterday's bundle
    # until someone hard-refreshes. It also covers version.json, which the app
    # reads to notice exactly that.
    location = __LIBRARIUM_BASE__/index.html {
        add_header Cache-Control "no-store";
        rewrite ^__LIBRARIUM_BASE__/(.*)$ /$1 break;
    }

    location = __LIBRARIUM_BASE__/version.json {
        add_header Cache-Control "no-store";
        rewrite ^__LIBRARIUM_BASE__/(.*)$ /$1 break;
    }

    # Locale bundles and the icons are not hashed, so a new string or a changed
    # logo would go unseen for as long as the browser felt like. Short enough to
    # pick up a deploy, long enough not to refetch on every navigation.
    location __LIBRARIUM_BASE__/locales/ {
        add_header Cache-Control "public, max-age=300";
        rewrite ^__LIBRARIUM_BASE__/(.*)$ /$1 break;
    }

    # Strip the prefix and serve from the document root, so the files on disk
    # do not have to be moved into a directory named after the mount point.
    # `rewrite ... break` rather than `alias`, because try_files against an
    # alias resolves inconsistently across nginx versions.
    location __LIBRARIUM_BASE__/ {
        rewrite ^__LIBRARIUM_BASE__/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
