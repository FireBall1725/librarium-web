name: CI

# The jobs live in FireBall1725/workflows so every React client runs the same
# ones. Change them there, not here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: FireBall1725/workflows/.github/workflows/ci-node.yml@v1
    with:
      # Matches the Dockerfile. CI previously tested 22 while the image shipped
      # 26, so it was validating a runtime nobody ran.
      node-version: "26"

  locales:
    name: Locales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
      # No dependencies: the check is plain node against the JSON on disk.
      # A locale that drifts from the source fails silently at runtime, so it
      # is worth catching where a failure is visible.
      - run: npm run check:locales
