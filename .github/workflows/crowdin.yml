name: Crowdin Sync

on:
  push:
    branches: [main]
    paths:
      - 'public/locales/en-CA/**'
      - 'crowdin.yml'
      - '.github/workflows/crowdin.yml'
  schedule:
    # Download translations every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  crowdin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Crowdin action
        uses: crowdin/github-action@v3
        with:
          upload_sources: true
          # Every French string in this repo was written by hand in a feature
          # PR. With this off, Crowdin only ever received the English source,
          # had no French to pair with it, and exported the source strings back
          # as if they were translations: PR #64 proposed reverting 421 values
          # to English, including the footer credit line. Sending the
          # translations up is what makes the round trip honest.
          upload_translations: true
          # Imported strings arrive approved. Without this they sit as
          # unapproved suggestions, and a project that exports only approved
          # translations would still send English back down.
          auto_approve_imported: true
          download_translations: true
          localization_branch_name: crowdin/translations
          create_pull_request: true
          pull_request_title: 'chore(i18n): new translations from Crowdin'
          pull_request_body: |
            Automated translation sync from Crowdin.

            Review the updated locale files and merge when ready.
          pull_request_labels: 'i18n, automated'
          pull_request_base_branch_name: main
          commit_message: 'chore(i18n): update translations from Crowdin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
