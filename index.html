<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Librarium — self-hosted, privacy-focused tracker for your physical book, manga, and comic collection." />
    <title>Librarium</title>
    <!-- Where this app is mounted, written in by the container entrypoint
         before nginx starts. Empty means the root, which is what a bundle
         served by anything other than our image will also see. Vite's own
         `base` is a build-time setting, so baking the path in would mean one
         image per deployment.

         The placeholder is deliberately not spelled the same as the variable:
         a substitution that matches both rewrites the assignment target too,
         and `window. = ""` is a syntax error that takes the whole app with
         it. -->
    <script>window.__LIBRARIUM_BASE_PATH__ = "%%LIBRARIUM_BASE_PATH%%";</script>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
