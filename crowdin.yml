project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: "."
preserve_hierarchy: true

files:
  - source: /public/locales/en-CA/**/*.json
    translation: /public/locales/%locale%/**/%original_file_name%
    languages_mapping:
      locale:
        fr: fr-FR
        de: de-DE
        ja: ja-JP
        es-ES: es-ES
        pt-BR: pt-BR
